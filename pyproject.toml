[project]
name = "aicli"
version = "0.1.0"
description = "A local-first AI assistant CLI supporting Ollama, OpenAI, and OpenRouter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["ai", "cli", "ollama", "assistant", "openai", "openrouter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1.7",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/linxi-667/aicli"
Repository = "https://github.com/linxi-667/aicli"
Issues = "https://github.com/linxi-667/aicli/issues"

[project.scripts]
aicli = "aicli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
